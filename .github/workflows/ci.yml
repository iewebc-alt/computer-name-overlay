name: Build and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build
        shell: powershell
        run: ./build.ps1
      - name: Test
        shell: powershell
        run: ./test.ps1
      - name: Package unsigned build
        shell: powershell
        run: ./package.ps1
      - name: Upload build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: unsigned-build
          path: artifacts/release/*
          if-no-files-found: error
